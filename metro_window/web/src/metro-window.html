<!--
地铁车窗的组件标记.
由 metro-window.ts 通过 Vite 的 `?raw` 原样引入并注入宿主容器.

为什么标记单独放一个文件,而不是写进 metro-window.ts 的模板字符串:
  - 这里是纯标记,没有任何插值;`.html` 有语法高亮/格式化,后续调视觉时改起来
    比 TS 里的多行字符串舒服;
  - 又不像"标记写在 index.html"那样,一旦车窗要嵌进站点的 HOME 标签页,
    就得在 index.html 和组件里各维护一份.

宿主只负责提供一个容器(约定加类名 `.metro-window`),容器内部不要手写标记:
挂载时会被本文件整体覆盖,所有 id 都只在容器内查询.
-->
<h1>🚇 地铁车窗 · Rust + WebGPU</h1>
<p class="subtitle">Rust/WASM 驱动 WebGPU:水滴物理/折射虚像/玻璃污渍/冷凝雾气/车厢灯光反射,三种风格实时切换</p>

<canvas id="webgpu-canvas" width="1344" height="756"></canvas>

<fieldset class="sliders" id="paramPanel" disabled>
    <legend>🎚 实时参数</legend>
    <div class="controls">
        <button class="style-btn" data-style="0">泡沫时期东京电车</button>
        <button class="style-btn" data-style="1">赛博朋克</button>
        <button class="style-btn" data-style="2">上海磁悬浮</button>
        <span style="flex:1"></span>
        <button id="startBtn">▶ 播放</button>
        <button id="pauseBtn" disabled>⏸ 暂停</button>
        <button id="resetBtn">🔄 重置</button>
    </div>
    <details class="slider-group" open>
        <summary>🚄 车速与背景距离</summary>
        <div class="slider-grid">
            <div class="slider-row">
                <label class="slider-label" for="vehicleSpeed">车速 <small>倍率</small></label>
                <input class="slider-range" id="vehicleSpeed" type="range" min="0" max="3" step="0.01" value="1">
                <input class="slider-value" id="vehicleSpeedNum" type="number" min="0" max="3" step="0.01" value="1">
            </div>
            <div class="slider-row">
                <label class="slider-label" for="farDistance">远景距离 <small>越大越慢</small></label>
                <input class="slider-range" id="farDistance" type="range" min="0.2" max="3" step="0.01" value="1">
                <input class="slider-value" id="farDistanceNum" type="number" min="0.2" max="3" step="0.01" value="1">
            </div>
            <div class="slider-row">
                <label class="slider-label" for="midDistance">中景距离 <small>越大越慢</small></label>
                <input class="slider-range" id="midDistance" type="range" min="0.2" max="3" step="0.01" value="1">
                <input class="slider-value" id="midDistanceNum" type="number" min="0.2" max="3" step="0.01" value="1">
            </div>
            <div class="slider-row">
                <label class="slider-label" for="nearDistance">近景距离 <small>越大越慢</small></label>
                <input class="slider-range" id="nearDistance" type="range" min="0.2" max="3" step="0.01" value="1">
                <input class="slider-value" id="nearDistanceNum" type="number" min="0.2" max="3" step="0.01" value="1">
            </div>
        </div>
    </details>

    <details class="slider-group" open>
        <summary>💧 水滴与风</summary>
        <div class="slider-grid">
            <div class="slider-row">
                <label class="slider-label" for="dropletSize">水滴大小 <small>倍率</small></label>
                <input class="slider-range" id="dropletSize" type="range" min="0.2" max="2.5" step="0.01" value="1">
                <input class="slider-value" id="dropletSizeNum" type="number" min="0.2" max="2.5" step="0.01" value="1">
            </div>
            <div class="slider-row">
                <label class="slider-label" for="windBackward">向后风 <small>随车速</small></label>
                <input class="slider-range" id="windBackward" type="range" min="0" max="1" step="0.01" value="0.15">
                <input class="slider-value" id="windBackwardNum" type="number" min="0" max="1" step="0.01" value="0.15">
            </div>
            <div class="slider-row">
                <label class="slider-label" for="windSway">摇摆风 <small>倍率</small></label>
                <input class="slider-range" id="windSway" type="range" min="0" max="2" step="0.01" value="1">
                <input class="slider-value" id="windSwayNum" type="number" min="0" max="2" step="0.01" value="1">
            </div>
            <div class="slider-row">
                <label class="slider-label" for="gravityScale">下落速度 <small>倍率</small></label>
                <input class="slider-range" id="gravityScale" type="range" min="0" max="3" step="0.01" value="1">
                <input class="slider-value" id="gravityScaleNum" type="number" min="0" max="3" step="0.01" value="1">
            </div>
            <div class="slider-row">
                <label class="slider-label" for="refractionScale">折射强度 <small>倍率</small></label>
                <input class="slider-range" id="refractionScale" type="range" min="0" max="3" step="0.01" value="1">
                <input class="slider-value" id="refractionScaleNum" type="number" min="0" max="3" step="0.01" value="1">
            </div>
        </div>
    </details>

    <details class="slider-group" open>
        <summary>🪟 玻璃质感</summary>
        <div class="slider-grid">
            <div class="slider-row">
                <label class="slider-label" for="dirtOpacity">污渍浓度</label>
                <input class="slider-range" id="dirtOpacity" type="range" min="0" max="1" step="0.01" value="0.55">
                <input class="slider-value" id="dirtOpacityNum" type="number" min="0" max="1" step="0.01" value="0.55">
            </div>
            <div class="slider-row">
                <label class="slider-label" for="fogOpacity">雾气浓度</label>
                <input class="slider-range" id="fogOpacity" type="range" min="0" max="1" step="0.01" value="0.30">
                <input class="slider-value" id="fogOpacityNum" type="number" min="0" max="1" step="0.01" value="0.30">
            </div>
            <div class="slider-row">
                <label class="slider-label" for="interiorOpacity">车厢灯光</label>
                <input class="slider-range" id="interiorOpacity" type="range" min="0" max="1" step="0.01" value="0.55">
                <input class="slider-value" id="interiorOpacityNum" type="number" min="0" max="1" step="0.01" value="0.55">
            </div>
        </div>
    </details>
    <div class="gpu_info">
        <strong>WebGPU 状态:</strong> <span id="status">初始化中...</span>
        <div class="layers">
            Layer 0 窗外实景 · Layer 1 水珠折射虚像 · Layer 2 玻璃污渍 ·
            Layer 3 冷凝雾气 · Layer 4 车厢灯光与倒影
        </div>
    </div>
</fieldset>
