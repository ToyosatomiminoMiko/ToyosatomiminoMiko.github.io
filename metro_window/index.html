<!DOCTYPE html>
<!--
地铁车窗页面,线上地址 /metro_window/.
- 页面只留页面级标记(标题/副标题/画布);设置面板(风格按钮/播放控制/滑块/
  状态区)由 web/src/ui/settings.ts 按 web/src/config.ts 的声明式模型生成.
- 行为与样式在 web/src/:metro_window.ts 负责交互与 WebGPU,metro_window.css
  负责样式,page.ts 只负责把它挂到 #metro-window 上.
- Rust/WASM + WebGPU 实时渲染,支持三种风格切换
-->
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGPU 地铁车窗 - Rust + WASM</title>
    <!-- 页面里不写内联样式块,样式一律外置 -->
</head>

<body>
    <!--
    车窗的容器与页面级标记.三条约定:
      - 容器必须带 .metro-window 类名,样式全靠它作用域;
      - 组件按 id 查画布(canvas),所有 id 都只在容器内解析;
      - 设置面板由 ui/settings.ts 生成后插到 canvas 之后,不写在这里.
    -->
    <div class="metro-window" id="metro-window">
        <h1>🚇 地铁车窗 · Rust + WebGPU</h1>
        <p class="subtitle">Rust/WASM 驱动 WebGPU:水滴物理/折射虚像/玻璃污渍/冷凝雾气/车厢灯光反射,三种风格实时切换</p>

        <canvas id="webgpu-canvas" width="1344" height="756"></canvas>
    </div>
    <script type="module" src="/metro_window/web/src/page.ts"></script>
</body>

</html>
