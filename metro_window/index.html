<!DOCTYPE html>
<!--

        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚇</text></svg>">
    <!-- 本页不引站点的 public/css/index.css,浏览器默认给 body 8px 外边距,去掉 -->
    <style>
        body {
            margin: 0;
        }
    </style>
</head>

<body>
    <div class="metro-window" id="metro-window"></div>
