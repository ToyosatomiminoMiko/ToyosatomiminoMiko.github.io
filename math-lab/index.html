<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>数学可视化 2D/3D</title>
    <link href="css/index.css" rel="stylesheet" type="text/css">
    <link href="css/detail.css" rel="stylesheet" type="text/css">
</head>

<body>
    <!-- Three.js 画布 -->
    <div id="canvas-container"></div>
    <!-- 右侧控制面板 -->
    <div id="panel">
        <h2>📐 表达式控制台</h2>

        <!-- 可隐藏部分 -->
        <div class="panel-body">
            <!-- 模式切换 -->
            <div class="mode-row">
                <button class="mode-btn active" data-mode="2d">2D</button>
                <button class="mode-btn" data-mode="3d">3D</button>

                <!-- 相机切换开关 -->
                <div class="cam-toggle">
                    <span class="cam-label active" data-cam="perspective">透视</span>
                    <label class="switch">
                        <input type="checkbox" id="camToggle">
                        <span class="slider"></span>
                    </label>
                    <span class="cam-label" data-cam="orthographic">正交</span>
                </div>

            </div>

            <!-- 表达式列表 -->
            <div class="expr-list" id="exprList">
                <!-- 由 JS 动态渲染 -->
                <div class="empty-hint">暂无表达式,添加一个吧 ✨</div>
            </div>

            <!-- 添加表达式 -->
            <div class="add-area">
                <div class="add-row">
                    <select id="exprTypeSelect">
                        <option value="2d">2D</option>
                        <option value="3d">3D</option>
                    </select>
                    <input type="text" id="exprInput" placeholder='example: sin(x)' spellcheck="false" />
                    <button class="add-btn" id="addExprBtn">+ 添加</button>
                </div>
                <div class="color-picker-row">
                    <label>颜色</label>
                    <input type="color" id="exprColorPicker" value="#6dd5ff" />
                    <label style="margin-left:8px;font-size:12px;color:#5a6a8a;">
                        提示: 使用 <code style="background:rgba(255,255,255,0.06);padding:0 6px;border-radius:4px;">x</code>
                        <span id="dimensionHint">(一元)</span>
                    </label>
                </div>
                <button id="addPointBtn">📍 添加点</button>
            </div>
            <!-- 详情面板 -->
            <div class="detail-area" id="detailArea">
                <div class="detail-tabs" id="detailTabs">
                    <button class="detail-tab active" data-tab="edit">📝 编辑</button>
                    <button class="detail-tab" data-tab="derivative">📐 求导</button>
                    <button class="detail-tab" data-tab="integral">📊 积分</button>
                    <button class="detail-tab" data-tab="gradient">📐 梯度</button>
                    <div class="detail-color-picker" id="detailColorPicker">
                        <label>颜色</label>
                        <input type="color" value="#ffffff" />
                    </div>
                </div>
                <div class="detail-content" id="detailContent">
                    <!-- 动态填充 -->
                </div>
            </div>
        </div>
    </div>
    <!-- 左侧抽屉切换把手 -->
    <button id="sidebarToggleBtn" title="fold/unfold">▶</button>
    <!-- 面板宽度拖拽手柄 -->
    <div id="resizeHandle"></div>
    <script type="module" src="./src/main.ts"></script>
</body>

</html>
