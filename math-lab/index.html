<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math-Lab DSL</title>
    <link href="css/dsl.css" rel="stylesheet" type="text/css">
</head>

<body>
    <div id="app">
        <div id="viewport"></div>

        <aside id="left-panel" class="panel">
            <header class="panel-header">
                <span class="panel-title">源码</span>
                <button id="run-btn">运行</button>
                <button data-panel-toggle="#left-panel">收起</button>
            </header>
            <section id="editor-panel">
                <textarea id="dsl-editor" spellcheck="false">
param a = 1 in [-5, 5, 0.1];
param b = 1 in [-5, 5, 0.1];
param j = 0 in [-5, 5, 0.1];
param k = 0 in [-5, 5, 0.1];

curve c1 = sin(x * a) * cos(x * b) {
    color = "#6dd5ff";
    range = [-8, 8];
    segments = 256;
}

surface s1 = sin(x * a) * cos(y * b) {
    color = "#ff6b8a";
    range = [-6, 6, -6, 6];
    segments = 96;
}

vector_field F = [y, -x, a] {
    range = [-4, 4, -4, 4, -4, 4];
    grid = [8, 8, 8];
    scale = 1.2;
}

matrix M = [
    [1, 0, 0, 2],
    [0, 1, 0, 3],
    [0, 0, 1, 4],
    [0, 0, 0, 1],
];

transform T = as_transform(M);

surface s2 = sin(x) * cos(y) {
    transform = T;
    range = [-6, 6, -6, 6];
    segments = 96;
}

transform T2 = translate([2, 1, 0]) * rotate([0, 0, pi / 4]) * scale([1.5, 1, 1]);

surface s3 = sin(x) * cos(y) {
    range = [-6, 6, -6, 6];
    segments = 96;
}

gradient g = grad(s1) at [j, k] {
    show = [point, normal, tangent_plane];
}

divergence d = div(F) at [1, 2, 3];

curl c = curl(F) at [1, 2, 3];

integral I1 = integral(c1) {
    method = riemann;
    range = [-4, 4];
    segments = 32;
};

integral I2 = integral(s1) {
    method = lebesgue;
    range = [-3, 3, -3, 3];
    segments = 32;
    layers = 16;
};
</textarea>
            </section>
            <div class="resize-handle resize-handle-right" data-resize-panel="left-panel"></div>
        </aside>

        <aside id="right-panel" class="panel">
            <header class="panel-header">
                <span class="panel-title">参数</span>
                <button data-panel-toggle="#right-panel">收起</button>
            </header>
            <section id="params-panel"></section>

            <header class="panel-header">视图</header>
            <section id="view-controls">
                <div class="cam-toggle">
                    <span class="cam-label active" data-cam="perspective">透视</span>
                    <label class="switch">
                        <input type="checkbox" id="camToggle">
                        <span class="slider"></span>
                    </label>
                    <span class="cam-label" data-cam="orthographic">正交</span>
                    <span>锁定旋转</span>
                    <label class="switch">
                        <input type="checkbox" id="rotationLockToggle">
                        <span class="slider"></span>
                    </label>
                </div>

                <div id="viewcube" class="viewcube">
                    <button type="button" data-view="top">上</button>
                    <button type="button" data-view="front">前</button>
                    <button type="button" data-view="right">右</button>
                    <button type="button" data-view="isometric" class="active">ISO</button>
                </div>
            </section>
            <div class="resize-handle resize-handle-left" data-resize-panel="right-panel"></div>
        </aside>

        <footer id="bottom-panel" class="panel">
            <header class="panel-header">
                <span class="panel-title">输出</span>
                <button data-panel-toggle="#bottom-panel">收起</button>
            </header>
            <section id="output-panel">
                <div id="diagnostics"></div>
            </section>
            <div class="resize-handle resize-handle-top" data-resize-panel="bottom-panel"></div>
        </footer>
    </div>

    <script type="module" src="./src/main.ts"></script>
</body>

</html>
