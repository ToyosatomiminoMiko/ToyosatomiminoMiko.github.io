    <div class="hero">

                <div class="badge">
                    <svg class="icon" aria-hidden="true" focusable="false">
                        <use href="#i-gavel"></use>
                    </svg> HTTP 451 · 法律原因不可用
                </div>
                <div class="badge">
                    <svg class="icon" aria-hidden="true" focusable="false">
                        <use href="#i-book-open"></use>
                    </svg> 纸张燃点 · 思想焚毁线
                </div>
            </div>

                <svg class="icon" aria-hidden="true" focusable="false" style="margin-right: 8px;">
                    <use href="#i-fire-flame-curved"></use>
                </svg> WHERE KNOWLEDGE TURNS TO ASH

                    <use href="#i-fire-flame-curved"></use>

                </svg> Error 451: Unavailable For Legal Reasons

                <div class="quote-author">-- 雷·布拉德伯里 《华氏451度》 隐喻</div>
            </div>

            <div class="flame-icon">
                <svg class="icon" aria-hidden="true" focusable="false">

                </svg>
