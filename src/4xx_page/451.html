    <title>error 451</title>
    <link rel="stylesheet" href="./451/451.css">

    <div class="hero">

            <div>
                <span class="temp-number">451</span><span class="unit">°F</span>
            </div>
            <!-- 双主题徽章: 法律不可用 & 纸的燃点 -->
            <div class="badge-row">
                <div class="badge">⚖️ HTTP 451 - 法律原因不可用</div>
                <div class="badge">📖 纸张燃点 - 思想焚毁线</div>
            </div>

            <div class="tagline">🔥 WHERE KNOWLEDGE TURNS TO ASH 🔥</div>

            <div class="description">
                根据相关法律法规及审查要求,您所请求的内容已被屏蔽,无法访问.<br>
                "华氏451度--这是纸张燃烧的温度,也是沉默与遗忘开始沸腾的刻度."
            </div>

            <div class="legal-message">
                <p>Error: 451 Unavailable For Legal Reasons</p>
                <p>错误: 451 法律原因不可用</p>
            </div>

            <div class="quote">
                "烧毁一本书的方法,并不是只有火焰.让它变得无人阅读,无人讨论,无人记忆----同样有效."
                <div class="quote-author">---- 雷·布拉德伯里 <<华氏451度>> 隐喻</div>
            </div>
        </div>
    </div>

    <!-- 粒子逻辑见 451/ (入口 index.ts -> ember/ -> shaders/*.wgsl) -->
    <script type="module" src="./451/index.ts"></script>

</body>

</html>
