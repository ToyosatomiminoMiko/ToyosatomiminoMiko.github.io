    <!-- 背景漂浮元素 增加幽默气氛 -->
    <div class="bg-float float-tea1">🍃</div>
    <div class="bg-float float-tea2">🫖</div>
    <div class="bg-float float-coffee">☕</div>

    <div class="card">
        <div class="status-code">418</div>
        <div class="teapot-badge">
            <svg class="icon" aria-hidden="true" focusable="false" style="margin-right: 8px;">
                <use href="#i-mug-saucer"></use>
            </svg> I'm a teapot
        </div>

        <!-- 茶壶主角 -->
        <div class="teapot-container">
            <div class="teapot" id="teapotMain">
                <!-- 蒸汽 (默认可见,幽默) -->
                <div class="steam">
                    <span></span><span></span><span></span>
                </div>
                <!-- 盖子 -->
                <div class="lid">
                    <div class="lid-knob"></div>
                </div>
                <!-- 壶嘴 -->
                <div class="spout"></div>
                <!-- 把手 -->
                <div class="handle"></div>

                <!-- 表情部分 -->
                <div class="face">
                    <div class="eye left-eye">
                        <div class="eyebrow"></div>
                        <div class="pupil"></div>
                    </div>
                    <div class="eye right-eye">
                        <div class="eyebrow"></div>
                        <div class="pupil"></div>
                    </div>
                </div>
                <div class="mouth"></div>
                <div class="blush blush-left"></div>
                <div class="blush blush-right"></div>
            </div>
        </div>

        <!-- 咖啡禁令标志 (幽默核心) -->
        <div class="coffee-ban">
            <svg class="icon" aria-hidden="true" focusable="false">
                <use href="#i-mug-hot"></use>
            </svg>
            <svg class="icon" aria-hidden="true" focusable="false" style="color: #b34e4e;">
                <use href="#i-ban"></use>
            </svg>
            <span class="ban-text">咖啡? 恕不接待</span>
            <svg class="icon" aria-hidden="true" focusable="false">
                <use href="#i-mug-saucer"></use>
            </svg>
        </div>

        <div class="message">
            🫖 服务器:"我是一个茶壶,不是咖啡机!"
        </div>
        <div class="sub-message">
            根据 RFC 2324 第2.3.2节,本实体拒绝冲泡咖啡.
        </div>

        <!-- RFC 搞笑引用 -->
        <div class="rfc-quote">
            <svg class="icon" aria-hidden="true" focusable="false" style="margin-right: 8px;">
                <use href="#i-gavel"></use>
            </svg>
            <span>错误: 418 我是一个茶壶</span>
            <span>Error: 418 I'm a teapot</span>
        </div>

        <!-- 互动按钮组 -->
        <div class="button-group">
            <button class="btn" id="makeTeaBtn">
                <svg class="icon" aria-hidden="true" focusable="false">
                    <use href="#i-leaf"></use>
                </svg> 泡杯红茶
            </button>
            <button class="btn coffee-btn" id="requestCoffeeBtn">
                <svg class="icon" aria-hidden="true" focusable="false">
                    <use href="#i-mug-hot"></use>
                </svg> 强行煮咖啡
            </button>
        </div>

        <!-- 动态消息 & 拒绝计数器 -->
        <div id="actionToast" class="toast-message">
            <svg class="icon" aria-hidden="true" focusable="false">
                <use href="#i-message"></use>
            </svg> 等待您的指令...
        </div>
        <div class="counter-panel" id="counterPanel">
            <svg class="icon" aria-hidden="true" focusable="false">
                <use href="#i-circle-xmark"></use>
            </svg> 今日拒绝咖啡请求: <span id="rejectCount">42</span> 次
        </div>
    </div>

    <!-- 交互逻辑: 见 418/ (入口 index.ts; 图标 sprite 见页面顶部) -->
    <script type="module" src="./418/index.ts"></script>
</body>

</html>
