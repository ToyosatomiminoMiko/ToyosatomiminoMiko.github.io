<!DOCTYPE html>

ToyosatomiminoMiko
-->
<html>

<head>
    <meta charset="utf-8">
    <title>ToyosatomiminoMiko</title>
    <link href="/css/index.css" rel="stylesheet" type="text/css">
</head>

<body>
    <header>
        <ul class="nav nav-tabs bg-light">
            <li class="nav-item">
                <a class="nav-link active" data-bs-toggle="tab" href="#home">HOME</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-bs-toggle="tab" href="#oled">OLED</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-bs-toggle="tab" href="#rbt">RBT</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-bs-toggle="tab" href="#pages">PAGES</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-bs-toggle="tab" href="#setting">SETTING</a>
            </li>
            <li class="nav-item">
                <img src="/images/user_img/img0.jpg" class="rounded-circle head">
            </li>
        </ul>
    </header>
    <main>
        <div class="tab-content">
            <!--标签页-->
            <!-- HOME -->
            <div class="tab-pane fade show active" id="home">
                <div class="card">
                    <div class="card-header">
                        <!-- LED 时钟 -->
                        <div id="app_led_clock">
                            <canvas id="time_canvas" ref="ledCanvas" height="8" width="65"></canvas>
                        </div>
                    </div>
                    <div class="card-body card-deck">
                        <!--内容主体-->
                    </div>
                </div>
            </div>
            <!-- OLED_canvas -->
            <div class="tab-pane fade" id="oled">
                <div class="card oled-card">
                    <div class="card-header">
                        <h4>OLED Canvas</h4>
                    </div>
                    <div class="card-body">
                        <!-- 状态指示区 -->
                        <div id="coordsDisplay" class="coords-display card-text">coordinate:(X:-,Y:-)</div>
                        <br />
                        <!-- 主画布 -->
                        <canvas id="pixelCanvas"></canvas>
                        <div id="pixelIndicator" class="pixel-indicator"></div>
                        <br />
                        <!-- 工具控制区 -->
                        <div class="tools">
                            <button type="button" class="btn btn-primary" onclick="clearCanvas()">颜色重置</button>
                            <button type="button" class="btn btn-primary" onclick="changeColor()"
                                id="change-color">🔄️暗⬛</button>
                            <input type="radio" name="tools" value="free" onchange="changeTool(this.value)" checked />绘制
                            <input type="radio" name="tools" value="line" onchange="changeTool(this.value)" />直线
                            <input type="radio" name="tools" value="rectangle" onchange="changeTool(this.value)" />矩形
                            <button type="button" class="btn btn-primary" onclick="exportEmbedded()">导出数据</button>
                            <button type="button" class="btn btn-primary" onclick="downloadPNG()" id="output-png-btn">
                                下载PNG</button>
                            <button type="button" class="btn btn-primary" onclick="toggleByteOrder()"
                                id="byte-order-btn">⬇低位模式(LSB)</button>
                        </div>
                        <br />
                        <!-- 数据输入输出容器 -->
                        <div>
                            <!--导出数据区-->
                            <div class="area-data">
                                <textarea id="exportOutput" class="textarea-data">
                                        </textarea><br />
                                <button type="button" class="btn btn-primary" onclick="copyExportedData()"
                                    id="output-button">
                                    复制到剪贴板</button>
                            </div>
                            <!--导入数据区-->
                            <div class="area-data">
                                <textarea id="importData" class="textarea-data"
                                    placeholder="const uint8_t bitmap[1024] = {0x00, 0x01, ...};">
                                        </textarea><br />
                                <button type="button" class="btn btn-primary" onclick="importEmbeddedData()">
                                    导入数据</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Red-Black Tree Lab -->
            <div class="tab-pane fade" id="rbt">
                <div class="card">
                    <div class="card-header">
                        <h4>🌳 Red-Black Tree Lab | 红黒树实验室</h4>
                    </div>
                    <div>
                        <span>💡 支持简写叶子节点 (例如 "5R" 等价于 "5R(nil,nil)")</span><br>
                        <span>🔴 R 红色 &nbsp;|&nbsp; ⚫ B 黒色</span><br>
                    </div>
                    <div class="container card-body"></div>
                </div>
            </div>
            <!-- PAGES -->
            <div class="tab-pane fade" id="pages">
                <section class="card-deck" id="page_list">
                    <!--内容主体-->
                    <div v-for="page in pages" class="card col-3">
                        <img class="card-img-top" :src="page.img_url">
                        <div class="card-body">
                            <h4 class="card-title">{{page.title}}</h4>
                            <p class="card-text">{{page.content}}</p>
                            <a href="#" class="btn" target="_blank">Read more</a>
                            <p class="card-text"><small class="text-muted">{{formatTime(page.created_at)}}</small></p>
                        </div>
                    </div>
                </section>
            </div>
            <!-- SETTING -->
            <div class="tab-pane fade" id="setting">
                <!--内容主体-->
                <div>
                    <!--背景修改-->
                    <h4>修改背景</h4>
                    <!--选择背景-->
                    <ul class="bgul">
                        <li class="bgli"><img src="/images/bgimg/bgstar.gif" class="rounded bgimg">
                            STAR</li>
                        <li class="bgli"><img src="/images/bgimg/bgcode.gif" class="rounded bgimg">
                            CODE</li>
                    </ul>
                </div>
            </div>
        </div>
    </main>
    <script>
        (function () {
            // 判断当前环境
            var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';

            // 版本映射表(与 package.json 同步维护)
            var deps = {
                vue: { ver: '3.5.40', file: 'dist/vue.esm-browser.js' },
                three: { ver: '0.185.1', file: 'build/three.module.js' },
                'three/addons/': { ver: '0.185.1', prefix: 'examples/jsm/' },
                'three/webgpu': { ver: '0.185.1', file: 'build/three.webgpu.js' },
                mathjs: { ver: '15.2.0', file: 'lib/browser/math.js' }
            };

            // 路径生成函数
            function url(pkg, file) {
                if (isLocal) {
                    return '/node_modules/' + pkg + '/' + file;
                } else {
                    return 'https://cdn.jsdelivr.net/npm/' + pkg + '@' + deps[pkg].ver + '/' + file;
                }
            }

            // --- 写入 CSS ---
            var bootstrapCSS = isLocal
                ? '/node_modules/bootstrap/dist/css/bootstrap.min.css'
                : 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css';
            document.write('<link href="' + bootstrapCSS + '" rel="stylesheet" type="text/css">');

            // --- 写入 importmap ---
            var imports = {};
            for (var key in deps) {
                if (key.endsWith('/')) {
                    // 带 / 的后缀是目录映射(如 three/addons/)
                    imports[key] = url('three', deps[key].prefix);
                } else {
                    imports[key] = url(key, deps[key].file);
                }
            }
            document.write('<script type="importmap">' + JSON.stringify({ imports: imports }) + '<\/script>');

            // --- 写入 Bootstrap JS(放在 importmap 之后) ---
            var bootstrapJS = isLocal
                ? '/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js'
                : 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js';
            document.write('<script src="' + bootstrapJS + '"><\/script>');
        })();
    </script>
    <script type="module" src="/js/main.js"></script>
    <script src="/js/oled.js"></script>
</body>

</html>
