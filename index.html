<!DOCTYPE html>

<!--
配色方案(`color-scheme: dark`)与页面底色 / 正文色都在 public/css/index.css
的"文档基线"一节,不在这里声明.
-->
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ToyosatomiminoMiko</title>

    <!--
      顺序有约束:index.css 全部按变量取值,令牌必须先加载.
      head 里只有这两份**文档级**样式表(通配重置 / 基线 / 首屏 / 导航条 / 窗格外壳);
      各标签页自己的观感跟着模块走,由 src/main.ts 经 Vite 打进产物(如
      src/oled/oled.css,见 public/css/index.css 顶部那份清单).站点默认字体的
      @font-face 也不在这里:它随 miko_ui 发布,由 src/main.ts 按分组引
      (import 'miko_ui/styles/fonts.css').
    -->
    <link href="/css/tokens.css" rel="stylesheet" type="text/css" />
    <link href="/css/index.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <!--
    页面骨架的唯一宿主:整页 UI 由 src/common/ui/site_shell.ts 生成后替换到这里.

    改界面的入口:
        src/common/site.config.ts       站点骨架的声明式模型(导航项/首屏/缩略图/宿主 id)
        src/common/ui/site_shell.ts     生成骨架,并把各部分的元素引用交回 main.ts
        src/<模块>/config.ts            模块自己的声明式模型(文案/DOM 契约/几何)
        src/<模块>/ui/*.ts              模块的标记生成
        public/css/*.css                文档级样式(重置 / 基线 / 首屏 / 导航条 / 窗格外壳)
        src/<模块>/*.css                各标签页自己的样式(跟模块同级,由模块入口 import)

    例外是 head 里的样式表顺序与 `<title>`:它们属于文档本身.
    -->
    <div id="site-root"></div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
