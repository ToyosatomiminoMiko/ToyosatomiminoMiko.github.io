<!--
配色方案(`color-scheme: dark`)与页面底色 / 正文色都在 public/css/index.css
的"文档基线"一节,不在这里声明.
-->
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ToyosatomiminoMiko</title>

    <!-- 顺序有约束:后两个样式表全部按变量取值,令牌必须先加载 -->
    <link href="/css/tokens.css" rel="stylesheet" type="text/css" />
    <link href="/css/index.css" rel="stylesheet" type="text/css" />
    <link href="/css/ieee754.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <!--
    页面骨架的唯一宿主:整页 UI 由 src/common/ui/site_shell.ts 生成后替换到这里.

    改界面的入口:
        src/common/site.config.ts       站点骨架的声明式模型(导航项/首屏/缩略图/宿主 id)
        src/common/ui/site_shell.ts     生成骨架,并把各部分的元素引用交回 main.ts
        src/<模块>/config.ts            模块自己的声明式模型(文案/DOM 契约/几何)
        src/<模块>/ui/*.ts              模块的标记生成
        public/css/*.css                样式(靠类名与 id 命中,不靠结构位置)

    例外是 head 里的样式表顺序与 `<title>`:它们属于文档本身.
    -->
    <div id="site-root"></div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
