name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      # 地铁车窗(metro_window)是 Rust -> wasm 的,前端入口静态 import 它的产物,
      # 所以构建期需要 wasm32 target 与 rustfmt/clippy(lint:rs 会跑).
      # 工具链跟 stable 走:仓库只锁 Cargo.lock 里的依赖,不锁编译器版本.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      # target/ 与 wasm-bindgen CLI 都不进仓库(见 .gitignore).冷缓存时 wgpu
      # 那一整棵依赖树要重编,所以两者的缓存都交给 rust-cache:
      #   workspaces        -> target(cargo workspace 根就是仓库根,见根 Cargo.toml,
      #                        所有 Rust crate 共用这一个 target/)
      #   cache-directories -> src/metro_window/.cargo-tools(build_wasm.py 把
      #                        wasm-bindgen CLI 装在这里,版本对齐 Cargo.lock)
      # cache-bin 关掉:命令行的 rustup/工具链代理由上面的 action 负责,
      # 再叠一层 ~/.cargo/bin 缓存只会把刚装好的代理换成旧的.
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-directories: src/metro_window/.cargo-tools
          cache-bin: false

      # 生产构建唯一入口:安装锁定依赖 -> Rust lint -> wasm -> 测试 ->
      # TypeScript 检查 -> Vite 构建,分阶段日志由脚本输出.
      #
      # 前端 UI 库 `miko_ui` 是 npm 上发布的包(package.json 里一条
      # `"miko_ui": "^0.1.6"`),`npm ci` 从 registry 直接装好:不需要 checkout
      # submodule,也不需要 npm 之外的任何凭据.
      #
      # `--ui npm` 在这里是**显式写出发布形态**, 不是必需: CI=true 时不带参数
      # build.py 也会默认走 npm(见它的 resolve_ui_source). 写上它之后, build.py
      # 还会把 miko_ui 对齐到 npm 的 `latest`(MIKO_UI_SYNC=auto), 所以**每次
      # Pages 部署拿到的都是库的最新发布版**; CI=true 让"查不到 latest"直接失败,
      # 不会静默部署旧版本.
      - name: Install, test and build
        run: bash ./build.sh --ui npm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
